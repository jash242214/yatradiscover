name: Deployment Readiness Check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  dns-validation:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install DNS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils dig
      
      - name: Check DNS records
        run: |
          echo "=== Checking Primary Domain ==="
          dig yatradiscover.com +short
          
          echo "=== Checking www subdomain ==="
          dig www.yatradiscover.com +short
          
          echo "=== Checking API subdomain ==="
          dig api.yatradiscover.com +short
          
          echo "=== Checking MX records ==="
          dig yatradiscover.com MX +short
          
          echo "=== Checking TXT records (SPF, DKIM, DMARC) ==="
          dig yatradiscover.com TXT +short
      
      - name: Check Cloudflare status
        run: |
          echo "=== Cloudflare Nameserver Status ==="
          dig yatradiscover.com NS +short

  ssl-validation:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check SSL/TLS certificates
        run: |
          echo "=== Checking yatradiscover.com SSL ==="
          echo | openssl s_client -servername yatradiscover.com -connect yatradiscover.com:443 2>/dev/null | openssl x509 -noout -dates
          
          echo "=== Checking www.yatradiscover.com SSL ==="
          echo | openssl s_client -servername www.yatradiscover.com -connect www.yatradiscover.com:443 2>/dev/null | openssl x509 -noout -dates
          
          echo "=== Checking api.yatradiscover.com SSL ==="
          echo | openssl s_client -servername api.yatradiscover.com -connect api.yatradiscover.com:443 2>/dev/null | openssl x509 -noout -dates
      
      - name: Verify HTTPS redirect
        run: |
          echo "=== Testing HTTP to HTTPS redirect ==="
          curl -I http://yatradiscover.com 2>&1 | head -1
          
          echo "=== Testing HTTPS response ==="
          curl -I https://yatradiscover.com 2>&1 | head -1

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for hardcoded secrets
        run: |
          echo "=== Scanning for exposed secrets ==="
          grep -r "AKIA" . --include="*.py" --include="*.js" --include="*.ts" --include="*.json" || echo "✓ No AWS keys found"
          grep -r "sk-" . --include="*.py" --include="*.js" --include="*.ts" --include="*.json" || echo "✓ No OpenAI keys found"
          grep -r "sk_live\|sk_test" . --include="*.py" --include="*.js" --include="*.ts" --include="*.json" || echo "✓ No Stripe keys found"
      
      - name: Check file permissions
        run: |
          echo "=== Checking sensitive files are in .gitignore ==="
          cat .gitignore | grep -E ".env|secrets|keys" || echo "Note: Check .gitignore contents"

  infrastructure-validation:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate DNS records plan
        run: |
          echo "=== Reviewing DNS Records Plan ==="
          cat infrastructure/cloudflare/dns-records-plan.md | grep -E "^##|^###|^-"
      
      - name: Validate SSL configuration
        run: |
          echo "=== Reviewing SSL Configuration ==="
          cat infrastructure/cloudflare/ssl-configuration.md | grep -E "^##|^###" || echo "File not found"
      
      - name: Validate security policy
        run: |
          echo "=== Reviewing Security Policy ==="
          cat infrastructure/cloudflare/security-policy.md | grep -E "^##|^###" || echo "File not found"

  deployment-status:
    runs-on: ubuntu-latest
    needs: [dns-validation, ssl-validation, security-scan, infrastructure-validation]
    if: always()
    
    steps:
      - name: Generate readiness report
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Deployment Readiness Check Report                    ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "DNS Validation:           ${{ needs.dns-validation.result }}"
          echo "SSL/TLS Validation:       ${{ needs.ssl-validation.result }}"
          echo "Security Scan:            ${{ needs.security-scan.result }}"
          echo "Infrastructure Check:     ${{ needs.infrastructure-validation.result }}"
          echo ""
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All checks passed! Ready for deployment."
          else
            echo "⚠️  Some checks failed. Review the logs above."
          fi
