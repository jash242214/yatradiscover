name: Frontend CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend/web
          npm ci
      
      - name: Run ESLint
        run: |
          cd frontend/web
          npm run lint
      
      - name: Type check
        run: |
          cd frontend/web
          npm run type-check
      
      - name: Run tests
        run: |
          cd frontend/web
          npm run test -- --coverage --watchAll=false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend/web
          npm ci
      
      - name: Build Next.js
        run: |
          cd frontend/web
          npm run build
      
      - name: Export build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: next-build
          path: frontend/web/.next
  
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend/web
          npm ci
      
      - name: Build Next.js
        run: |
          cd frontend/web
          npm run build
      
      - name: Start server for lighthouse
        run: |
          cd frontend/web
          npm start &
          sleep 10
      
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v9
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true

  notify:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    
    steps:
      - name: Notify on success
        if: success()
        run: echo "✅ Frontend CI/CD pipeline completed successfully"
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Frontend CI/CD pipeline failed"
